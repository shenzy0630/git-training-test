# scripts/config/deploy.conf
# vision-toolkit 部署配置
# 所有脚本都 source 这个文件来获取运行时参数

# ---- 项目信息 ----
PROJECT_NAME="vision-toolkit"
COMPOSE_PROJECT_NAME="vision-toolkit"   # docker compose -p 的参数

# ---- 镜像 ----
IMAGE_NAME="ghcr.io/your-org/vision-toolkit"
IMAGE_TAG="${IMAGE_TAG:-latest}"         # 允许用环境变量覆盖

# ---- 服务 ----
SERVICE_PORT=8000                        # 对外暴露的端口
HEALTHCHECK_URL="http://localhost:${SERVICE_PORT}/health"
HEALTHCHECK_TIMEOUT=60                   # 健康检查最长等待秒数

# ---- 路径 ----
PROJECT_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"
LOG_DIR="${PROJECT_ROOT}/logs/deploy"
BACKUP_DIR="${PROJECT_ROOT}/.deploy-backup"

# ---- 前置约束 ----
MIN_DISK_GB=5                            # 部署前至少需要的可用磁盘
REQUIRED_DOCKER_VERSION="24.0"           # 最低 Docker 版本